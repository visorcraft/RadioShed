# Single source of truth for app version. Read by:
#   - Android: build.gradle.kts -> versionName / versionCode
#   - iOS:     Info.plist -> CFBundleShortVersionString / CFBundleVersion
#
# Format:
#   versionName  = "{major}.{minor}.{patch}"
#   versionCode  = monotonically increasing integer (Android requires this;
#                  iOS uses it as CFBundleVersion build number)
#
# Bump rules:
#   - Patch: bug fixes, no new features
#   - Minor: backwards-compatible features
#   - Major: breaking changes (e.g. backup format incompatibility)
#   - versionCode: bump on every public release; never decrement.
versionMajor=0
versionMinor=1
versionPatch=0
versionCode=1
