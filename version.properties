# Single source of truth for app version. Read by Gradle at
# configure-time and propagated to:
#   - AndroidManifest versionName / versionCode (via AGP defaults
#     in composeApp/build.gradle.kts)
#   - compose.desktop.nativeDistributions.packageVersion (Windows
#     MSI / Linux DEB / macOS DMG installer metadata)
#   - The generated com.visorcraft.radioshed.BuildInfo Kotlin
#     object (rendered into composeApp/build/generated/buildinfo
#     by the generateBuildInfo task; consumed by Settings → About,
#     the Home screen footer, etc.)
#   - Eventually iOS Info.plist CFBundleShortVersionString /
#     CFBundleVersion once the iOS target unstubs.
#
# Format:
#   versionName  = "{major}.{minor}.{patch}"
#   versionCode  = monotonically increasing integer (Android requires
#                  this; iOS uses it as CFBundleVersion build number)
#   buildDate    = UTC date string surfaced in About; bump on
#                  every ship. Free-form — typically YYYY-MM-DD with
#                  an optional lowercase letter suffix for same-day
#                  re-spins.
#
# Bump rules:
#   - Patch: bug fixes, no new features
#   - Minor: backwards-compatible features
#   - Major: breaking changes (e.g. backup format incompatibility)
#   - versionCode: bump on every public release; never decrement.
versionMajor=1
versionMinor=2
versionPatch=1
versionCode=5
buildDate=2026-06-09
