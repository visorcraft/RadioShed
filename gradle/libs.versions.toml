[versions]
agp = "8.11.2"
jaudiotagger = "3.0.1"
media3 = "1.6.1"
android-compileSdk = "36"
android-minSdk = "30"
android-targetSdk = "36"
androidx-activity = "1.13.0"
coil = "3.3.0"
androidx-lifecycle = "2.10.0"
composeMultiplatform = "1.10.3"
# `compose.materialIconsExtended` is the upstream-frozen artifact: the
# Compose Multiplatform plugin no longer ships updates after 1.7.3 and
# emits a deprecation warning if you reference it via the `compose.*`
# accessor. Pinning here so we get the working build, not the warning.
# Migration to Material Symbols (vector resources) is a future option;
# until then, `Icons.Default.PlayArrow` etc. continue to resolve through
# this artifact at the frozen 1.7.3 level.
materialIconsExtended = "1.7.3"
kotlin = "2.3.20"
kotlinxCoroutines = "1.10.2"
kotlinxSerialization = "1.8.0"
koin = "4.1.0"
material3 = "1.10.0-alpha05"
materialKolor = "4.1.1"
multiplatformSettings = "1.3.0"
# Bundled modern SQLite for Android via JitPack (requery's repo).
# Pinned because the API exposes the `SupportSQLiteOpenHelper.Factory`
# that SQLDelight's AndroidSqliteDriver needs.
requerySqliteAndroid = "3.45.0"
sqldelight = "2.1.0"
ktlint = "12.1.2"
detekt = "1.23.8"

# JNA — direct foreign-function binding to the system libvlc 3.x used by
# the desktop AudioEngine (replaces the GPL VLCJ layer). jna-jpms carries
# com.sun.jna.* (Library/Native/Pointer); jna-platform-jpms carries
# com.sun.jna.platform.win32 (Advapi32Util, for reading the Windows VLC
# install dir from the registry). Apache-2.0 (dual LGPL/Apache; we use
# Apache). Desktop only; never linked into the Android APK.
jna = "5.14.0"

[libraries]
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
compose-uiTooling = { module = "org.jetbrains.compose.ui:ui-tooling", version.ref = "composeMultiplatform" }
androidx-lifecycle-viewmodelCompose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtimeCompose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "composeMultiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "composeMultiplatform" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "material3" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "composeMultiplatform" }
compose-components-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "composeMultiplatform" }
compose-uiToolingPreview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "composeMultiplatform" }
compose-materialIconsExtended = { module = "org.jetbrains.compose.material:material-icons-extended", version.ref = "materialIconsExtended" }

# ---- Phase 2: persistence, DI, settings, async, serialization ----
sqldelight-dialectSqlite338 = { module = "app.cash.sqldelight:sqlite-3-38-dialect", version.ref = "sqldelight" }
sqldelight-androidDriver = { module = "app.cash.sqldelight:android-driver", version.ref = "sqldelight" }
sqldelight-nativeDriver = { module = "app.cash.sqldelight:native-driver", version.ref = "sqldelight" }
sqldelight-sqliteDriver = { module = "app.cash.sqldelight:sqlite-driver", version.ref = "sqldelight" }
sqldelight-coroutinesExtensions = { module = "app.cash.sqldelight:coroutines-extensions", version.ref = "sqldelight" }
sqldelight-primitiveAdapters = { module = "app.cash.sqldelight:primitive-adapters", version.ref = "sqldelight" }

# Bundled SQLite (modern). Android's system SQLite is locked to the OS
# image — on Snapdragon-Bengal head units (the AutoLinkR Elite) that's
# 3.32, which predates RETURNING (3.35). Without this bundle, every
# Folders/Stations insert errors out at runtime.
requery-sqliteAndroid = { module = "com.github.requery:sqlite-android", version.ref = "requerySqliteAndroid" }

koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-android = { module = "io.insert-koin:koin-android", version.ref = "koin" }
koin-compose = { module = "io.insert-koin:koin-compose", version.ref = "koin" }

# Material 3 dynamic color: derives a full ColorScheme (primary,
# secondary, tertiary, all on-* and container variants for light /
# dark) from a single seed Color via the same algorithm Android's
# Material You uses on wallpaper extraction. KMP — works on both
# Android and iOS targets. Used by Settings → Theme color so users
# can pick a custom seed instead of relying on the wallpaper.
material-kolor = { module = "com.materialkolor:material-kolor", version.ref = "materialKolor" }

multiplatformSettings-noArg = { module = "com.russhwolf:multiplatform-settings-no-arg", version.ref = "multiplatformSettings" }
multiplatformSettings-coroutines = { module = "com.russhwolf:multiplatform-settings-coroutines", version.ref = "multiplatformSettings" }

kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
# Swing dispatcher — provides Dispatchers.Swing on the desktop target.
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "kotlinxCoroutines" }

# JNA — desktop audio backend. The binding in NativeLibVlc.kt loads the
# system libvlc 3.x via JNA and discovers it at startup. jna-jpms provides
# the core FFI types; jna-platform-jpms provides the win32 registry helper.
jna = { module = "net.java.dev.jna:jna-jpms", version.ref = "jna" }
jna-platform = { module = "net.java.dev.jna:jna-platform-jpms", version.ref = "jna" }

# ---- Phase 3: scanner ----
jaudiotagger = { module = "net.jthink:jaudiotagger", version.ref = "jaudiotagger" }

# ---- Image loading (Coil 3, multiplatform) ----
# Used to render album art (extracted from ID3/Vorbis/M4A tags during scan,
# persisted under filesDir/artwork/<sha256>) in NowPlaying, MiniPlayer, and
# the Continue Listening callout. file:// URIs work out of the box; the
# `coil-compose` artifact ships with Compose Multiplatform AsyncImage.
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }

# ---- Phase 4: audio engine ----
androidx-media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
androidx-media3-session = { module = "androidx.media3:media3-session", version.ref = "media3" }
androidx-media3-common = { module = "androidx.media3:media3-common", version.ref = "media3" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidLibrary = { id = "com.android.library", version.ref = "agp" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
sqldelight = { id = "app.cash.sqldelight", version.ref = "sqldelight" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
