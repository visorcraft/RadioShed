[versions]
agp = "8.11.2"
jaudiotagger = "3.0.1"
media3 = "1.6.1"
android-compileSdk = "36"
android-minSdk = "30"
android-targetSdk = "36"
androidx-activity = "1.13.0"
coil = "3.3.0"
androidx-appcompat = "1.7.1"
androidx-core = "1.18.0"
androidx-espresso = "3.7.0"
androidx-lifecycle = "2.10.0"
androidx-testExt = "1.3.0"
composeMultiplatform = "1.10.3"
junit = "4.13.2"
kotlin = "2.3.20"
kotlinxCoroutines = "1.10.1"
kotlinxSerialization = "1.8.0"
koin = "4.1.0"
material3 = "1.10.0-alpha05"
materialKolor = "4.1.1"
multiplatformSettings = "1.3.0"
# Bundled modern SQLite for Android via JitPack (requery's repo).
# Pinned because the API exposes the `SupportSQLiteOpenHelper.Factory`
# that SQLDelight's AndroidSqliteDriver needs.
requerySqliteAndroid = "3.45.0"
sqldelight = "2.1.0"
# VLCJ — Java bindings for libvlc. 4.10.x requires Java 17+ and works
# with libvlc 3.0.x on Windows / macOS / Linux. Used only by the
# desktop target's AudioEngine; never linked into the Android APK.
vlcj = "4.10.1"

[libraries]
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlin-testJunit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }
junit = { module = "junit:junit", version.ref = "junit" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
androidx-testExt-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-testExt" }
androidx-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "androidx-espresso" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "androidx-appcompat" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
compose-uiTooling = { module = "org.jetbrains.compose.ui:ui-tooling", version.ref = "composeMultiplatform" }
androidx-lifecycle-viewmodelCompose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtimeCompose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "composeMultiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "composeMultiplatform" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "material3" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "composeMultiplatform" }
compose-components-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "composeMultiplatform" }
compose-uiToolingPreview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "composeMultiplatform" }

# ---- Phase 2: persistence, DI, settings, async, serialization ----
sqldelight-dialectSqlite338 = { module = "app.cash.sqldelight:sqlite-3-38-dialect", version.ref = "sqldelight" }
sqldelight-androidDriver = { module = "app.cash.sqldelight:android-driver", version.ref = "sqldelight" }
sqldelight-nativeDriver = { module = "app.cash.sqldelight:native-driver", version.ref = "sqldelight" }
sqldelight-sqliteDriver = { module = "app.cash.sqldelight:sqlite-driver", version.ref = "sqldelight" }
sqldelight-coroutinesExtensions = { module = "app.cash.sqldelight:coroutines-extensions", version.ref = "sqldelight" }
sqldelight-primitiveAdapters = { module = "app.cash.sqldelight:primitive-adapters", version.ref = "sqldelight" }

# Bundled SQLite (modern). Android's system SQLite is locked to the OS
# image — on Snapdragon-Bengal head units (the AutoLinkR Elite) that's
# 3.32, which predates RETURNING (3.35). Without this bundle, every
# Folders/Stations insert errors out at runtime.
requery-sqliteAndroid = { module = "com.github.requery:sqlite-android", version.ref = "requerySqliteAndroid" }

koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-android = { module = "io.insert-koin:koin-android", version.ref = "koin" }
koin-compose = { module = "io.insert-koin:koin-compose", version.ref = "koin" }

# Material 3 dynamic color: derives a full ColorScheme (primary,
# secondary, tertiary, all on-* and container variants for light /
# dark) from a single seed Color via the same algorithm Android's
# Material You uses on wallpaper extraction. KMP — works on both
# Android and iOS targets. Used by Settings → Theme color so users
# can pick a custom seed instead of relying on the wallpaper.
material-kolor = { module = "com.materialkolor:material-kolor", version.ref = "materialKolor" }

multiplatformSettings-noArg = { module = "com.russhwolf:multiplatform-settings-no-arg", version.ref = "multiplatformSettings" }
multiplatformSettings-coroutines = { module = "com.russhwolf:multiplatform-settings-coroutines", version.ref = "multiplatformSettings" }

kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
# Swing dispatcher — used by AudioEngineDesktop to marshal VLCJ media
# callbacks back onto the Compose UI thread.
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "kotlinxCoroutines" }

# VLCJ — desktop audio backend. JNA-based; needs a libvlc install
# discovered at startup via `NativeDiscovery().discover()`.
vlcj = { module = "uk.co.caprica:vlcj", version.ref = "vlcj" }

# ---- Phase 3: scanner ----
jaudiotagger = { module = "net.jthink:jaudiotagger", version.ref = "jaudiotagger" }

# ---- Image loading (Coil 3, multiplatform) ----
# Used to render album art (extracted from ID3/Vorbis/M4A tags during scan,
# persisted under filesDir/artwork/<sha256>) in NowPlaying, MiniPlayer, and
# the Continue Listening callout. file:// URIs work out of the box; the
# `coil-compose` artifact ships with Compose Multiplatform AsyncImage.
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }

# ---- Phase 4: audio engine ----
androidx-media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
androidx-media3-session = { module = "androidx.media3:media3-session", version.ref = "media3" }
androidx-media3-common = { module = "androidx.media3:media3-common", version.ref = "media3" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidLibrary = { id = "com.android.library", version.ref = "agp" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
sqldelight = { id = "app.cash.sqldelight", version.ref = "sqldelight" }
