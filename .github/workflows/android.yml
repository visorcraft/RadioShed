name: Android

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test (Android)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Skip if Gradle project not yet scaffolded
        id: scaffold
        run: |
          if [ -f settings.gradle.kts ] || [ -f settings.gradle ]; then
            echo "scaffolded=true" >> "$GITHUB_OUTPUT"
          else
            echo "scaffolded=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Gradle project found; KMP scaffolding lands in Phase 1. Skipping build."
          fi

      - name: ktlint
        if: steps.scaffold.outputs.scaffolded == 'true'
        run: ./gradlew ktlintCheck --no-daemon
        continue-on-error: true   # remove once style is enforced

      - name: detekt
        if: steps.scaffold.outputs.scaffolded == 'true'
        run: ./gradlew detekt --no-daemon
        continue-on-error: true

      - name: Common tests (JVM)
        if: steps.scaffold.outputs.scaffolded == 'true'
        run: ./gradlew :shared:jvmTest --no-daemon
        continue-on-error: true

      - name: Android unit tests
        if: steps.scaffold.outputs.scaffolded == 'true'
        run: ./gradlew :androidApp:testDebugUnitTest --no-daemon
        continue-on-error: true

      - name: assembleDebug
        if: steps.scaffold.outputs.scaffolded == 'true'
        run: ./gradlew :androidApp:assembleDebug --no-daemon

      - name: Upload debug APK
        if: steps.scaffold.outputs.scaffolded == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: androidApp-debug-${{ github.sha }}
          path: androidApp/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: warn
