name: Android

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test (Android)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'microsoft'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Skip if Gradle project not yet scaffolded
        id: scaffold
        run: |
          if [ -f settings.gradle.kts ] || [ -f settings.gradle ]; then
            echo "scaffolded=true" >> "$GITHUB_OUTPUT"
          else
            echo "scaffolded=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Gradle project found; KMP scaffolding lands in Phase 1. Skipping build."
          fi

      - name: ktlint
        if: steps.scaffold.outputs.scaffolded == 'true'
        run: ./gradlew ktlintCheck --no-daemon
        continue-on-error: true   # full-tree pass; PRs also run changed-file check below

      - name: ktlint (changed Kotlin on PR)
        if: steps.scaffold.outputs.scaffolded == 'true' && github.event_name == 'pull_request'
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          FILTER=$(git diff --name-only --diff-filter=ACMRT "$BASE"...HEAD -- '*.kt' '*.kts' | paste -sd, -)
          if [ -z "$FILTER" ]; then
            echo "No Kotlin changes — skipping."
            exit 0
          fi
          echo "Checking: $FILTER"
          ./gradlew ktlintCheck -PinternalKtlintGitFilter="$FILTER" --no-daemon

      - name: detekt
        if: steps.scaffold.outputs.scaffolded == 'true'
        run: ./gradlew detekt --no-daemon
        continue-on-error: true

      - name: Common tests (JVM)
        if: steps.scaffold.outputs.scaffolded == 'true'
        run: ./gradlew :composeApp:testDebugUnitTest --no-daemon

      - name: assembleDebug
        if: steps.scaffold.outputs.scaffolded == 'true'
        run: ./gradlew :composeApp:assembleDebug --no-daemon

      - name: Upload debug APK
        if: steps.scaffold.outputs.scaffolded == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v7
        with:
          name: composeApp-debug-${{ github.sha }}
          path: composeApp/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: warn
