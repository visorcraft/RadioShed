name: iOS

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

# NOTE: macOS runner minutes count 10x against the GitHub Actions free quota
# on private repos. Keep this job lean. Prefer Linux for non-iOS-specific
# tests (those run in android.yml).

jobs:
  build:
    name: Build & test (iOS)
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '17'

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Skip if KMP project not yet scaffolded
        id: scaffold
        run: |
          if [ -f settings.gradle.kts ] || [ -f settings.gradle ]; then
            echo "scaffolded=true" >> "$GITHUB_OUTPUT"
          else
            echo "scaffolded=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Gradle project found; KMP scaffolding lands in Phase 1. Skipping build."
          fi

      - name: swiftlint
        if: steps.scaffold.outputs.scaffolded == 'true' && hashFiles('iosApp/**/*.swift') != ''
        run: |
          if command -v swiftlint >/dev/null 2>&1; then
            cd iosApp && swiftlint --strict
          else
            echo "::notice::swiftlint not installed on runner; skipping"
          fi
        continue-on-error: true

      - name: Common tests on iOS simulator
        if: steps.scaffold.outputs.scaffolded == 'true'
        run: ./gradlew :composeApp:iosSimulatorArm64Test --no-daemon
        continue-on-error: true

      - name: Build iOS framework
        if: steps.scaffold.outputs.scaffolded == 'true'
        run: ./gradlew :composeApp:linkDebugFrameworkIosSimulatorArm64 --no-daemon
        continue-on-error: true

      - name: Build iosApp (debug, simulator)
        if: steps.scaffold.outputs.scaffolded == 'true' && hashFiles('iosApp/iosApp.xcodeproj/project.pbxproj') != ''
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
            build
