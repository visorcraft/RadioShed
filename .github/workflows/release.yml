name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    name: Android release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'microsoft'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Unit tests
        run: ./gradlew :composeApp:testDebugUnitTest --no-daemon

      - name: Build release APK and AAB
        run: ./gradlew :composeApp:assembleRelease :composeApp:bundleRelease --no-daemon

      - name: Debug-sign release APK for sideload
        run: |
          VERSION=$(grep '^versionMajor=' version.properties | cut -d= -f2).$(grep '^versionMinor=' version.properties | cut -d= -f2).$(grep '^versionPatch=' version.properties | cut -d= -f2)
          IN=composeApp/build/outputs/apk/release/composeApp-release-unsigned.apk
          ALIGNED=composeApp/build/outputs/apk/release/aligned.apk
          OUT="composeApp/build/outputs/apk/release/RadioShed-${VERSION}-debug-signed.apk"
          AAB_IN=composeApp/build/outputs/bundle/release/composeApp-release.aab
          AAB_OUT="composeApp/build/outputs/bundle/release/RadioShed-${VERSION}-release.aab"

          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/Android/Sdk}}"
          ZIPALIGN=$(find "$SDK/build-tools" -name zipalign -type f 2>/dev/null | sort -V | tail -1)
          APKSIGNER=$(find "$SDK/build-tools" -name apksigner -type f 2>/dev/null | sort -V | tail -1)
          if [ -z "$ZIPALIGN" ] || [ -z "$APKSIGNER" ]; then
            echo "::error::Android build-tools (zipalign/apksigner) not found under $SDK"
            exit 1
          fi

          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          "$ZIPALIGN" -f 4 "$IN" "$ALIGNED"
          "$APKSIGNER" sign \
            --ks debug.keystore \
            --ks-pass pass:android \
            --ks-key-alias androiddebugkey \
            --out "$OUT" \
            "$ALIGNED"
          "$APKSIGNER" verify "$OUT"
          mv "$AAB_IN" "$AAB_OUT"

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v7
        with:
          name: android-release
          path: |
            composeApp/build/outputs/apk/release/RadioShed-*-debug-signed.apk
            composeApp/build/outputs/bundle/release/RadioShed-*-release.aab
          retention-days: 30

  desktop:
    name: Linux desktop artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - name: Install libvlc and packaging tools
        run: sudo apt-get update && sudo apt-get install -y vlc dpkg

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'microsoft'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Desktop unit tests
        run: ./gradlew :composeApp:desktopTest --no-daemon

      - name: Package AppImage and deb
        run: |
          ./gradlew :composeApp:packageSingleFileAppImage --no-daemon
          ./gradlew :composeApp:packageDistributionForCurrentOS --no-daemon

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v7
        with:
          name: desktop-linux
          path: |
            composeApp/build/compose/binaries/main/appimage/*.AppImage
            composeApp/build/compose/binaries/main/deb/*.deb
          retention-days: 30

  publish:
    name: Attach to GitHub Release
    needs: [android, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Download Android artifacts
        uses: actions/download-artifact@v8
        with:
          name: android-release
          path: dist/android

      - name: Download desktop artifacts
        uses: actions/download-artifact@v8
        with:
          name: desktop-linux
          path: dist/desktop

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          find dist -type f -print0 | xargs -0 -I{} gh release upload "$TAG" "{}" --clobber
